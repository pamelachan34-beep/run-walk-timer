<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>跑走間歇計時器</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#222;--muted:#777;--line:#ddd7cc;--run:#dcecff;--walk:#dff2df;--warm:#f6ead2;--cool:#ece7f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:22px 17px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
.wrap{max-width:560px;margin:auto}h1{font-size:27px;margin:4px 0}.sub{color:var(--muted);font-size:14px;margin:0 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px}
.row{display:grid;grid-template-columns:1fr 88px 88px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row.simple{grid-template-columns:1fr 184px}.label b{display:block;font-size:17px}.label small{color:var(--muted)}
.field{text-align:center}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}input{width:100%;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 4px;background:#fff;color:#222}
button{font-family:inherit}.start{width:100%;margin-top:16px;border:0;border-radius:17px;padding:17px;background:#222;color:#fff;font-size:20px;font-weight:700}.summary{text-align:center;color:#777;font-size:13px;margin-top:12px}.tip{font-size:12px;color:#888;margin-top:12px;line-height:1.5}
#timerScreen{display:none;min-height:calc(100dvh - 44px);flex-direction:column;text-align:center}.phasebox{flex:1;display:flex;flex-direction:column;justify-content:center;border-radius:28px;padding:25px 12px;margin-bottom:14px;background:var(--warm)}
.phase{font-size:36px;font-weight:800}.round{font-size:15px;color:#666;margin:8px 0 25px}.time{font-size:clamp(82px,25vw,130px);font-weight:800;line-height:.9;letter-spacing:-5px;font-variant-numeric:tabular-nums}.next{font-size:16px;color:#666;margin-top:28px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;font-size:16px;color:#222}.controls .dark{background:#222;color:#fff}.end{border:0;background:transparent;color:#777;padding:14px;font-size:14px;width:100%}
</style>
</head>
<body>
<div class="wrap">
<section id="setupScreen">
<h1>跑走間歇計時器</h1>
<p class="sub">自訂跑、走、組數、暖身與收操。</p>
<div class="card">
<div class="row"><div class="label"><b>🏃 跑</b><small>每次跑多久</small></div><div class="field"><label>分鐘</label><input id="runM" type="number" value="1" min="0"></div><div class="field"><label>秒</label><input id="runS" type="number" value="0" min="0" max="59"></div></div>
<div class="row"><div class="label"><b>🚶 走</b><small>每次走多久</small></div><div class="field"><label>分鐘</label><input id="walkM" type="number" value="2" min="0"></div><div class="field"><label>秒</label><input id="walkS" type="number" value="0" min="0" max="59"></div></div>
<div class="row simple"><div class="label"><b>🔁 組數</b><small>跑＋走算一組</small></div><div class="field"><label>組</label><input id="rounds" type="number" value="8" min="1"></div></div>
<div class="row"><div class="label"><b>暖身</b><small>設 0 即跳過</small></div><div class="field"><label>分鐘</label><input id="warmM" type="number" value="5" min="0"></div><div class="field"><label>秒</label><input id="warmS" type="number" value="0" min="0" max="59"></div></div>
<div class="row"><div class="label"><b>收操</b><small>設 0 即跳過</small></div><div class="field"><label>分鐘</label><input id="coolM" type="number" value="5" min="0"></div><div class="field"><label>秒</label><input id="coolS" type="number" value="0" min="0" max="59"></div></div>
<button type="button" class="start" id="startBtn">開始訓練</button>
<div class="summary" id="summary">跑 01:00 ／ 走 02:00 × 8 組</div>
<div class="tip">全程靜音。跑步時請讓頁面保持開啟。</div>
</div>
</section>

<section id="timerScreen">
<div class="phasebox" id="phasebox">
<div class="phase" id="phase">暖身</div>
<div class="round" id="round">準備開始</div>
<div class="time" id="time">05:00</div>
<div class="next" id="next">下一段：跑 01:00</div>
</div>
<div class="controls"><button type="button" class="dark" id="pauseBtn">暫停</button><button type="button" id="skipBtn">跳過這段</button></div>
<button type="button" class="end" id="endBtn">結束訓練</button>
</section>
</div>

<script>
(function(){
"use strict";
var stages=[],index=0,remaining=0,paused=false,timer=null,deadline=0;
function el(id){return document.getElementById(id)}
function val(id){var x=parseInt(el(id).value,10);return isNaN(x)?0:Math.max(0,x)}
function secs(m,s){return val(m)*60+Math.min(59,val(s))}
function fmt(x){x=Math.max(0,Math.round(x));var m=Math.floor(x/60),s=x%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function settings(){return{run:secs("runM","runS"),walk:secs("walkM","walkS"),rounds:Math.max(1,val("rounds")),warm:secs("warmM","warmS"),cool:secs("coolM","coolS")}}
function updateSummary(){var v=settings();el("summary").textContent="跑 "+fmt(v.run)+" ／ 走 "+fmt(v.walk)+" × "+v.rounds+" 組"}
function makeStages(){
 var v=settings(),a=[],i;
 if(v.run<1){alert("跑步時間至少設定 1 秒");return null}
 if(v.warm>0)a.push({type:"warm",label:"暖身",sec:v.warm,round:"準備開始"});
 for(i=1;i<=v.rounds;i++){
   a.push({type:"run",label:"跑",sec:v.run,round:"第 "+i+" / "+v.rounds+" 組"});
   if(v.walk>0)a.push({type:"walk",label:"走",sec:v.walk,round:"第 "+i+" / "+v.rounds+" 組"});
 }
 if(v.cool>0)a.push({type:"cool",label:"收操",sec:v.cool,round:"最後放鬆"});
 return a
}
function showStage(){
 if(timer){clearInterval(timer);timer=null}
 if(index>=stages.length){finish();return}
 remaining=stages[index].sec;deadline=Date.now()+remaining*1000;paint();
 timer=setInterval(tick,250)
}
function paint(){
 var s=stages[index],n=stages[index+1],box=el("phasebox");
 el("phase").textContent=s.label;el("round").textContent=s.round;el("time").textContent=fmt(remaining);
 el("next").textContent=n?"下一段："+n.label+" "+fmt(n.sec):"最後一段";
 if(s.type==="run")box.style.background="var(--run)";
 else if(s.type==="walk")box.style.background="var(--walk)";
 else if(s.type==="cool")box.style.background="var(--cool)";
 else box.style.background="var(--warm)"
}
function tick(){
 if(paused)return;
 remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 el("time").textContent=fmt(remaining);
 if(remaining<=0){index++;showStage()}
}
function start(){
 stages=makeStages();if(!stages)return;
 index=0;paused=false;
 el("setupScreen").style.display="none";
 el("timerScreen").style.display="flex";
 el("pauseBtn").textContent="暫停";
 showStage()
}
function pause(){
 if(!stages.length)return;
 paused=!paused;
 if(paused){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));el("pauseBtn").textContent="繼續"}
 else{deadline=Date.now()+remaining*1000;el("pauseBtn").textContent="暫停"}
}
function skip(){if(stages.length){index++;showStage()}}
function finish(){
 if(timer)clearInterval(timer);
 el("phase").textContent="完成 ✓";el("round").textContent="今天的訓練完成";el("time").textContent="";el("next").textContent="記得補水與放鬆";el("phasebox").style.background="var(--cool)"
}
function end(){
 if(timer)clearInterval(timer);stages=[];paused=false;
 el("timerScreen").style.display="none";el("setupScreen").style.display="block"
}
el("startBtn").addEventListener("click",start,false);
el("pauseBtn").addEventListener("click",pause,false);
el("skipBtn").addEventListener("click",skip,false);
el("endBtn").addEventListener("click",end,false);
var inputs=document.querySelectorAll("input");
for(var i=0;i<inputs.length;i++)inputs[i].addEventListener("input",updateSummary,false);
updateSummary();
})();
</script>
</body>
</html>
